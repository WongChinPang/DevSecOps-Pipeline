# Example: How to use the DevSecOps Security Scan Action
#
# Add this file to any repo at .github/workflows/security-scan.yml
# to automatically scan IaC templates and Dockerfiles on every push and PR.

name: DevSecOps Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run DevSecOps Security Scan
        uses: WongChinPang/DevSecOps-Pipeline/.github/actions/security-scan@main
        with:
          iac_file: infrastructure.yaml
          dockerfile: Dockerfile
